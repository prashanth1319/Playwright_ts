name: Playwright Tests (TypeScript)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Type check
        run: npm run typecheck

      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          CI: true
        continue-on-error: true
        id: run_tests

      - name: Zip HTML report
        if: always()
        run: |
          if [ -d "playwright-report" ]; then
            zip -r playwright-report.zip playwright-report
          fi

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d "allure-results" ]; then
            npx allure generate allure-results --clean -o allure-report || true
          fi

      - name: Zip Allure report
        if: always()
        run: |
          if [ -d "allure-report" ]; then
            zip -r allure-report.zip allure-report
          fi

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14

      - name: Zip Extent-style report
        if: always()
        run: |
          if [ -d "extent-report" ]; then
            zip -r extent-report.zip extent-report
          fi

      - name: Upload Extent-style report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: extent-report/
          retention-days: 14


      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1

  deploy-pages:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Extent report artifact
        uses: actions/download-artifact@v4
        with:
          name: extent-report
          path: extent-report

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages asset
        uses: actions/upload-pages-artifact@v1
        with:
          path: extent-report

      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v1

      - name: Send email with direct Extent report link
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "Playwright Test Report - ${{ needs.test.result }} - ${{ github.repository }}"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_FROM }}
          html_body: |
            <h2>Playwright Test Run: ${{ needs.test.result }}</h2>
            <p><b>Repository:</b> ${{ github.repository }}</p>
            <p><b>Branch:</b> ${{ github.ref_name }}</p>
            <p><b>Commit:</b> ${{ github.sha }}</p>
            <p><b>Triggered by:</b> ${{ github.actor }}</p>
            <p>The Extent report is available here:</p>
            <p><a href="${{ steps.deploy-pages.outputs.page_url }}">Open Extent Report</a></p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View GitHub Actions Run</a></p>
          attachments: playwright-report.zip,extent-report.zip